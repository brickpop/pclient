spec = "0.1"

# The entry types this wiki uses: `wiki check` reports any other.
types = ["task", "spec", "note"]

# Operating docs, not entries.
ignore = ["AGENTS.md", "CLAUDE.md"]

# Entries nothing has to link to.
ignore_orphans = ["backlog/**"]

# A board view for wikiview: uncomment it to see the tasks as a board.
# [[tool.wikiview.board]]
# id      = "board"
# path    = "/backlog"
# name    = "Board"
# where   = ["type=task"]
# status  = "status"
# columns = ["backlog", "todo", "in-progress", "blocked", "done"]
# lane    = "priority"
# lanes   = ["high", "medium", "low"]
